name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  # Needed to create the GitHub Release and upload assets.
  contents: write

# One release at a time: two tags pushed together would otherwise race for the
# same GitHub Release and tap commit. Never cancel a run that may have already
# published assets.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the changelog can diff against the previous tag.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # Pin GoReleaser so the release schema/behaviour doesn't drift.
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with write access to trm42/homebrew-tap, for the cask step.
          # When unset, .goreleaser.yaml skips the cask upload rather than failing.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
