name: Lint

on:
  push:
  pull_request:

# Least privilege: nothing here writes back to the repo. Set explicitly rather
# than inheriting the repo/org default, which is read/write in some setups.
permissions:
  contents: read

jobs:
  golangci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pin the linter version so the enabled-linter set and rules don't
          # drift between CI runs. Bump deliberately. Config: .golangci.yml.
          version: v2.12.2
