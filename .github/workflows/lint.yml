name: Lint

on:
  push:
  pull_request:

jobs:
  golangci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          # Pin the linter version so the enabled-linter set and rules don't
          # drift between CI runs. Bump deliberately. Config: .golangci.yml.
          version: v2.12.2
