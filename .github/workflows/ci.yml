name: CI

on:
  push:
  pull_request:

# Least privilege: nothing here writes back to the repo. Set explicitly rather
# than inheriting the repo/org default, which is read/write in some setups.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: go.mod
            go-version-file: go.mod
          - name: stable
            go-version: stable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go-version-file }}
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "gofmt needs to be run on:"
            echo "$files"
            exit 1
          fi
      - name: SPDX headers
        run: |
          # grep -L exits 0 whether or not it printed anything, so the list
          # itself is the verdict.
          files="$(git ls-files '*.go' | xargs grep -L 'SPDX-License-Identifier' || true)"
          if [ -n "$files" ]; then
            echo "missing an SPDX-License-Identifier header:"
            echo "$files"
            exit 1
          fi
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: go vet
        run: go vet ./...
      - name: go vet (dev fixtures)
        run: go vet -tags dev ./...
      - name: go build
        run: go build -o smartview .
      - name: go build (darwin/arm64)
        # The release targets darwin but every job here is Linux; cross-compiling
        # catches a darwin break before the release does. No platform-specific
        # compilation units exist, so a macos runner would add little.
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /dev/null .
      - name: go build (dev fixtures)
        run: go build -tags dev -o /dev/null .
      - name: go test
        # No dev-tagged tests exist, so a `-tags dev` run would repeat this one.
        run: go test -race -cover ./...
      - name: govulncheck
        run: |
          # Pinned, like the golangci-lint version in lint.yml: an unpinned
          # @latest silently changes what CI installs. Bump deliberately.
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: goreleaser/goreleaser-action@v7
        with:
          # Keep in sync with the version pinned in release.yml.
          version: '~> v2'
          args: check
