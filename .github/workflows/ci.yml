name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: go.mod
            go-version-file: go.mod
          - name: stable
            go-version: stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.go-version-file }}
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "gofmt needs to be run on:"
            echo "$files"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build -o smartview .
      - name: go build (dev fixtures)
        run: go build -tags dev -o /dev/null .
      - name: go test
        run: go test -race -cover ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
